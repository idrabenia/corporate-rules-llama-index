[project]
name = "llama-index-hello"
version = "0.1.0"
description = "Example LlamaIndex project with a FastAPI backend and web chat UI"
requires-python = ">=3.10"
dependencies = [
    "llama-index>=0.10.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "llama-index-embeddings-fastembed>=0.1.0",
    "llama-index-llms-ollama>=0.1.0",
    "fastembed>=0.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = []
